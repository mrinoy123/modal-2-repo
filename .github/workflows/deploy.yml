name: 🚀 Deploy API Engines to Modal (Account 2)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which API engine to deploy?'
        required: true
        default: 'ltx-19b'
        type: choice
        options:
          - ltx-19b
          - sonic-lypsync

jobs:
  deploy-modal:
    runs-on: ubuntu-latest
    steps:
      - name: 🛰️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install Modal & Dependencies
        run: pip install modal fastapi

      - name: 🚀 Deploy LTX-19b New v20 Engine
        if: github.event.inputs.target == 'ltx-19b'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID_2 }}        # 👈 Updated to match your screenshot
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET_2 }}  # 👈 Updated to match your screenshot
        run: |
          echo "Deploying LTX-19b-new-v20 Video API to Account 2..."
          modal deploy LTX-19b-new-v20.py

      - name: 🗣️ Deploy Sonic Lip-Sync Engine
        if: github.event.inputs.target == 'sonic-lypsync'
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID_2 }}        # 👈 Updated to match your screenshot
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET_2 }}  # 👈 Updated to match your screenshot
        run: |
          echo "Deploying Sonic Lip-Sync API to Account 2..."
          modal deploy sonic-lypsync-deploy.py
