name: 🚀 Deploy API Engines to Modal (Account 2)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which API engine to deploy?'
        required: true
        default: 'ltx-19b'
        type: choice
        options:
          - ltx-19b
          - sonic-1vpsync

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.12'

      - name: Install Modal
        run: |
          python -m pip install --upgrade pip
          pip install modal

      - name: Deploy LTX Video API Engine
        # Maps the unique Account 2 secrets in GitHub to what Modal expects
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID_2 }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
        run: |
          echo "Deploying LTX-19b-new-v20 Video API to Account 2..."
          modal deploy LTX-19b-new-v20.py
