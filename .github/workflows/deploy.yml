# ==============================================================================
# PART 1: WORKFLOW IDENTITY & INTERACTIVE TRIGGERS
# Purpose: Define the action namespace and configure structural choice selection
#          inputs for isolated cloud runtime deployment targeting Account 2.
#          Includes the new toggle target for the simplified workflow matrix.
# ==============================================================================
name: 🚀 Deploy API Engines to Modal (Account 2)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which API engine to deploy?'
        required: true
        default: 'ltx23-all-workflow'
        type: choice
        options:
          - working-director-ltx23-simpleworkflow
          - ltx23-all-workflow
          - LTX-23-new
          - ltx-19b
          - sonic-1vpsync
          - ltx-23-lypsync-workflow

# ==============================================================================
# PART 2: ISOLATED DEPLOYMENT ENVIRONMENT ORCHESTRATION
# Purpose: Provision fresh runner compute nodes and inject isolated access keys.
#          Establishes a synchronized environment runner with custom dependency layers.
# ==============================================================================
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Modal & Runner Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install modal fastapi aiohttp

# ==============================================================================
# PART 3: TARGET ROUTING EVALUATION LOGIC
# Purpose: Execute execution branches matching target boundaries cleanly, 
#          ensuring fresh environments are generated out-of-the-box.
#          Handles mapping for both simple and complex workflow scripts natively.
# ==============================================================================
      - name: Deploy Selected API Engine
        # Maps the unique Account 2 secrets in GitHub to what Modal expects
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID_2 }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET_2 }}
          TARGET: ${{ github.event.inputs.target }}
        run: |
          if [ "$TARGET" = "working-director-ltx23-simpleworkflow" ]; then
            echo "🚀 Deploying working-director-ltx23-simpleworkflow Video API to Account 2..."
            echo "ℹ️ This execution thread establishes an independent, unshared container snapshot image."
            modal deploy working-director-ltx23-simpleworkflow.py

          elif [ "$TARGET" = "ltx23-all-workflow" ]; then
            echo "🚀 Deploying completely brand-new ltx23-all-workflow Video API to Account 2..."
            echo "ℹ️ This execution thread establishes an independent, unshared container snapshot image."
            modal deploy ltx23-all-workflow.py

          elif [ "$TARGET" = "LTX-23-new" ]; then
            echo "🚀 Deploying completely brand-new LTX-23-new Video API to Account 2..."
            echo "ℹ️ This execution thread establishes an independent, unshared container snapshot image."
            modal deploy LTX-23-new.py
            
          elif [ "$TARGET" = "ltx-19b" ]; then
            echo "Deploying LTX-19b-new-v20 Video API to Account 2..."
            modal deploy LTX-19b-new-v20.py
            
          elif [ "$TARGET" = "sonic-1vpsync" ]; then
            echo "Deploying sonic-1vpsync Video API to Account 2..."
            modal deploy sonic-1vpsync.py

          elif [ "$TARGET" = "ltx-23-lypsync-workflow" ]; then
            echo "🚀 Deploying completely brand-new ltx-23-lypsync-workflow Video API to Account 2..."
            echo "ℹ️ This execution thread establishes an independent, unshared container snapshot image."
            modal deploy ltx-23-lypsync-workflow.py
            
          else
            echo "❌ Error: Unknown deployment target '$TARGET'"
            exit 1
          fi
